name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew build
      - name: Attach plugin to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" endercord-plugin/build/libs/Endercord.jar --clobber
          else
            gh release create "$RELEASE_TAG" endercord-plugin/build/libs/Endercord.jar --draft --generate-notes
          fi
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run check && npm test
        working-directory: endercord-workers
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-bot
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./endercord-workers
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Remove superseded private preview image
        if: github.ref_name == 'v1.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          endpoint="/users/$PACKAGE_OWNER/packages/container/endercord-bot/versions?per_page=100"
          ids="$(gh api --paginate "$endpoint" --jq '.[] | select(.metadata.container.tags == ["v1.1.0"]) | .id')"
          for id in $ids; do
            gh api --method DELETE "/users/$PACKAGE_OWNER/packages/container/endercord-bot/versions/$id"
          done
          remaining="$(gh api --paginate "$endpoint" --jq '.[] | select(.metadata.container.tags | index("v1.1.0")) | .id')"
          if [ -n "$remaining" ]; then
            echo 'The preview image still has another tag; its version was preserved.' >&2
            exit 1
          fi
