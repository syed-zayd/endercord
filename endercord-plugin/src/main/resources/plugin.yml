name: Endercord
version: '1.1.0'
main: com.zaydsyed.endercord.EndercordPlugin
api-version: '26.1'
commands:
  endercord:
    description: Endercord admin commands
    usage: /endercord setup | /endercord whitelist <add|remove|list|reload>
    permission: endercord.admin
    permission-message: You must be a server operator to manage Endercord.
permissions:
  endercord.admin:
    description: Set up Endercord and manage Discord console access
    default: op
